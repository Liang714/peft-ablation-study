# LoRA rank sweep — rank 4 (lowest capacity in the sweep).
# alpha = 2 * r (common heuristic), applied to all attention projections.

run_name: "lora_rank4"

training:
  method: "lora"
  learning_rate: 2.0e-4
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2

lora:
  enabled: true
  r: 4
  alpha: 8
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

quantization:
  enabled: false
