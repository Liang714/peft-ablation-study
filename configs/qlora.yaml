# QLoRA — 4-bit NF4 quantized base model + LoRA adapter. Rank 16 chosen as
# the sweep midpoint so it's directly comparable to lora_rank16 (same
# adapter capacity, only the base-model quantization differs) as well as to
# full_finetune. Requires a CUDA GPU (bitsandbytes) — run on Colab/Kaggle.

run_name: "qlora"

training:
  method: "qlora"
  learning_rate: 2.0e-4
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

quantization:
  enabled: true
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
