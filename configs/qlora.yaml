# QLoRA — 4-bit NF4 quantized base model + LoRA adapter. Rank 16 chosen as
# the sweep midpoint so it's directly comparable to lora_rank16 (same
# adapter capacity, only the base-model quantization differs) as well as to
# full_finetune. Requires a CUDA GPU (bitsandbytes) — run on Colab/Kaggle.

run_name: "qlora"

training:
  method: "qlora"
  learning_rate: 2.0e-4
  # per_device_train_batch_size=4 / grad_accum=4 matches full_finetune's config exactly (real
  # CUDA OOM hit at batch=8 for LoRA on Colab's T4 — the frozen/quantized base model still runs
  # a full forward/backward for every sequence in the batch, and Qwen2.5's ~152k vocab makes that
  # expensive regardless of how few params are trainable or how the base is quantized).
  # effective_batch_size stays 16, so max_steps/compute budget is unaffected.
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

quantization:
  enabled: true
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  # compute dtype not configured here — auto-resolved from actual GPU capability at runtime
  # (Colab's free-tier T4 doesn't support bf16 despite being CUDA; see src/models/loader.py)
  bnb_4bit_use_double_quant: true
