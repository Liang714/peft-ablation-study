# LoRA rank sweep — rank 16.

run_name: "lora_rank16"

training:
  method: "lora"
  learning_rate: 2.0e-4
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

quantization:
  enabled: false
