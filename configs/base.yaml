# Shared defaults, merged with (and overridden by) every method-specific
# config in this directory. See src/config.py for the schema these keys map
# to — an unknown key here or in a method file raises an error rather than
# being silently ignored.

seed: 42

model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"   # chosen to comfortably fit FULL fine-tuning
  max_seq_len: 1024                    # on a single free-tier T4 (~15GB VRAM).
  # Covers ~96% of the real train-split token-length distribution (p95=878,
  # measured in Step 2 with this model's own chat template). Examples longer
  # than this are DROPPED (not truncated) by scripts/prepare_data.py, so no
  # training example ever has its response silently cut off.
  trust_remote_code: false

data:
  dataset_name: "databricks/databricks-dolly-15k"
  dataset_categories: ["closed_qa", "information_extraction"]
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1

# Fixed compute budget: total training tokens seen, held identical across
# EVERY run (full fine-tune, all 4 LoRA ranks, QLoRA). Chosen over gpu_hours
# because it's deterministic regardless of which GPU a free-tier session
# happens to hand out — important since Colab/Kaggle don't guarantee a fixed
# card. FINALIZED in Step 2 against the real tokenized train split (2,506
# examples / 794,426 tokens/epoch after length-filtering to max_seq_len=1024,
# see data/processed/dataset_stats.json): 3 epochs equivalent = 2,383,278.
compute_budget:
  definition: "total_tokens"
  total_tokens: 2383278

# Fixed forgetting benchmark, run identically before AND after every single
# fine-tuning run (not just once at the end — see Step 7).
forgetting_eval:
  benchmark: "cais/mmlu"
  sample_size: 150
  sampling_strategy: "stratified_all_subjects"   # ~2-3 questions per subject across all 57
  seed: 42

evaluation:
  device: "auto"        # picks cuda > mps > cpu. A local MPS test hung on this Mac (not
                         # root-caused — may be this torch/transformers version combo), so
                         # src/models/loader.py's "auto" resolution deliberately skips MPS and
                         # falls back to cpu for now, which is fast enough for a 0.5B model
                         # (verified: ~4s model load, <1s per generate() call).
  max_new_tokens: 128    # covers the vast majority of Dolly closed_qa/information_extraction responses
  do_sample: false       # greedy decoding — deterministic, reproducible eval
  batch_size: 8

logging:
  backend: "mlflow"       # local + free, no account needed
  experiment_name: "peft-ablation-study"
  run_name_template: "method={method}_seed={seed}"
  tracking_uri: "./mlruns"

checkpoint_dir: "checkpoints"
results_dir: "results"

# Shared training defaults — method configs override method, learning_rate,
# per_device_train_batch_size, gradient_accumulation_steps (these differ
# meaningfully between full fine-tune and PEFT methods).
training:
  warmup_ratio: 0.03
  weight_decay: 0.0
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true
  optim: "adamw_torch"
  # bf16/fp16 intentionally not configured here — resolved at runtime from actual GPU capability
  # (src/models/loader.py's resolve_dtype). See src/config.py's TrainingConfig for why.
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "no"
